<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Archan Architecture — Estúdio de arquitetura moderna focado em projetos funcionais, estéticos e orientados ao investimento imobiliário." />
    <meta name="keywords" content="arquitetura, projetos, plantas, design, minimalismo, imóveis" />
    <title>Archan Arquiteture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <noscript>
        <div style="padding: 2rem; text-align: center; font-family: system-ui;">
          <h1>Archan Arquiteture</h1>
          <p>JavaScript é necessário para este site funcionar.</p>
          <p>Por favor, ative o JavaScript no seu navegador.</p>
        </div>
      </noscript>
      <div id="loading-fallback" style="padding: 2rem; text-align: center; font-family: system-ui; color: #382414; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fcf9f2;">
        <div>
          <h1 style="font-family: 'Playfair Display', serif; font-size: 3rem; margin-bottom: 1rem;">Archan</h1>
          <p style="font-size: 1.25rem;">Carregando...</p>
          <div style="margin-top: 2rem; width: 40px; height: 40px; border: 3px solid #eadecd; border-top-color: #b58c49; border-radius: 50%; animation: spin 1s linear infinite; margin: 2rem auto;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // Hide loading fallback when Vue app mounts
      const observer = new MutationObserver(() => {
        const app = document.getElementById('app');
        if (app && app.children.length > 1) {
          const fallback = document.getElementById('loading-fallback');
          if (fallback) fallback.style.display = 'none';
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('app'), { childList: true, subtree: true });
      
      // Fallback: hide after 10 seconds max
      setTimeout(() => {
        const fallback = document.getElementById('loading-fallback');
        if (fallback) fallback.style.display = 'none';
      }, 10000);
    </script>
  </body>
</html>
